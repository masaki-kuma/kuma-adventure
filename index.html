rect(0,0,16,240,'#514054');rect(304,0,16,240,'#514054');rect(0,224,320,16,'#514054');

// door
rect(144,19,32,42,'#392b3e');rect(146,19,28,38,found.size===3?'#89b2a1':'#6f4439');rect(150,23,20,31,found.size===3?'#bdd7aa':'#946653');rect(164,42,3,3,'#f5d789');if(found.size===3){rect(144,18,32,4,'#f6d88d');txt('OPEN',149,30,'#24453d',7)}

rect(125,113,80,69,'#70465a');rect(129,117,72,61,'#97637a');rect(134,122,62,51,'#bc8492');rect(145,132,40,32,'#d1a29b');

rect(40,34,40,42,'#382c43');rect(44,38,32,34,'#27394c');rect(47,41,26,26,'#314960');rect(60,40,3,29,'#bfa383');rect(45,53,30,3,'#bfa383');rect(50,44,4,4,'#fff1bb');rect(43,72,36,5,'#bd8e7d');

rect(32,48,48,32,'#5d3b39');rect(36,50,40,27,'#996442');for(let j=0;j<3;j++){rect(37,56+j*8,38,3,'#70472f');for(let i=0;i<5;i++){const colors=['#d9a16e','#b66f72','#8e9f7c','#d6b081','#866482'];rect(40+i*7,50+j*8,4,6,colors[(i+j)%5])}}rect(32,78,48,4,'#432d32');

rect(224,144,48,34,'#58383b');rect(226,148,44,28,'#9b643f');rect(228,145,40,9,'#d0a069');rect(231,154,6,20,'#c99b54');rect(259,154,6,20,'#c99b54');rect(246,156,7,8,'#e8cf76');rect(248,159,3,4,'#735039');
// lanterns
rect(97,44,5,18,'#60434d');rect(93,49,13,13,'#deac66');rect(96,51,7,8,'#ffeab0');rect(284,40,4,19,'#60434d');rect(280,45,12,13,'#e5b36e');rect(283,47,6,8,'#ffe8ae');

for(const o of furniture){if(!found.has(o.id)){let px=(o.x+o.w/2)*16,py=o.y*16-3;txt('✦',px-3,py,'#fff0a1',10)}}

sprite('scarecrow',5,10,'down',1);sprite('ghost',7,10,'down',1);sprite('vampire',player.x,player.y,dir,frame);

const [dx,dy]=dirs[dir];rect(player.x*16+7+dx*10,player.y*16+2+dy*8,3,3,'#ffdb8a');
// bottom overlay
rect(16,209,288,14,'#372c43');txt('くまドラを動かして おやつを 3つ集めよう！',27,219,'#fce5ba',8);
if(won){rect(36,79,248,73,'#241d32');rect(40,83,240,65,'#68465b');rect(44,87,232,57,'#30283a');txt('★ だっしゅつ せいこう！ ★',67,109,'#ffe08b',13);txt('3びきで おやつパーティー！',75,128,'#fff3d2',10)}
}
for(const im of Object.values(sprites))im.onload=()=>draw();
const keyDir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};
document.addEventListener('keydown',e=>{if(currentScreen!=='room')return;if(keyDir[e.key]){e.preventDefault();if(!e.repeat)move(keyDir[e.key]);held=keyDir[e.key]}else if([' ','Enter','e','E'].includes(e.key)){e.preventDefault();if(!e.repeat)interact()}});document.addEventListener('keyup',e=>{if(keyDir[e.key]&&held===keyDir[e.key])held=null});window.addEventListener('blur',()=>held=null);
let pointerHeld=null;document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pointerHeld=b.dataset.dir;held=pointerHeld;lastHeldMove=performance.now();move(pointerHeld);b.classList.add('held')});const stop=e=>{pointerHeld=null;held=null;b.classList.remove('held')};b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop)});
function loop(t){if(held&&t-lastHeldMove>145){move(held);lastHeldMove=t}requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('interact').addEventListener('click',interact);document.getElementById('restart').addEventListener('click',reset);reset();
</script></body></html>
